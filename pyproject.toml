[project]
name = "recursive-symlink-resolver"
version = "0.1.1"
description = "Follows symbolic links to find the actual file and reports if a loop is encountered"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
